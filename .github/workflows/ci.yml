name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the history rules read the history
          
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The two tools `make check` shells out to. golangci-lint is pinned
      # because these linters gain checks between releases, and an unpinned one
      # turns somebody else's release into your red build on a pull request that
      # touched nothing.
      - name: linters
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          go install golang.org/x/tools/cmd/deadcode@latest

      - name: make check
        run: make check

      - name: build
        run: make build

  # Its own job because it needs no matrix, so it answers in seconds and answers
  # even when the tests are failing. It runs the linters against this repository
  # itself: the tool is its own first user.
  docs:
    name: docs prose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make docs

  oss:
    name: open-source readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the history rules read the history
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make oss

  walkthrough:
    name: docs walkthrough
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make walkthrough

  # The release manifest is validated on every change, because a manifest naming
  # a file that no longer exists breaks the release build outright and schema
  # validation does not catch it.
  release-check:
    name: release manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check
