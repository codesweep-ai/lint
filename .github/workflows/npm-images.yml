name: publish images

# Publish a commit's npm packages as a container image named like the wrapper
# package: ghcr.io/<owner>/npm/lint:<version>. It holds this version's five
# tarballs, and carries the last 20 versions of each forward from main's
# previous image. A client copies the tarballs out with
# `node npm/npm-images.mjs fetch`, and prune-images.yml expires the old images.
#
# Nothing here reaches npm. It is a workflow of its own, so its token cannot
# publish to npm, and its builds show on the CI dashboard as a row of their own.
#
# It starts when ci finishes, and publishes only a push to main whose ci run
# passed, so no image comes from a commit that fails any ci job. Pull requests
# get none: `fetch` takes the newest image whatever branch built it, so an image
# of a pull request would stand in for main's.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read
  actions: read # ci's earlier runs on main name the image to carry forward
  packages: write # push the image

# One build at a time, so each finds the one before it finished. Not cancelled,
# because a superseded build still carries its packages forward.
concurrency:
  group: npm-images
  cancel-in-progress: false

jobs:
  publish:
    name: publish images
    # A run started by ci finishing holds a token that can write packages even
    # when ci ran for a fork's pull request. Asking for a push to main is what
    # keeps unreviewed code away from that token, as well as what keeps pull
    # requests out of the images.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit ci passed. A run started by ci finishing is otherwise on
          # main's latest commit, which a later push may already have moved.
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0 # the version is the commit, so the history has to be here

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x

      # Every platform, as the npm workflow builds. The before hooks are skipped:
      # ci has already vetted and tested this commit.
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: build --snapshot --clean --skip=before

      - name: package
        run: node npm/build.mjs --dev

      - name: log in to ghcr.io
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | podman login ghcr.io -u '${{ github.actor }}' --password-stdin

      # The wrapper first, because the first package names the image.
      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node npm/npm-images.mjs publish npm/dist/lint npm/dist/lint-*/
